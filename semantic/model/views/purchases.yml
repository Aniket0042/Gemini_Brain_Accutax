views:
  - name: purchases
    description: >-
      Issued purchase documents (bills, expenses, cash expenses, less vendor credits), before VAT
      unless the measure says otherwise. Drafts, voided and cancelled documents are excluded.
    meta:
      kind: flow
      time_dimension: purchases.document_date
      ai_context: >-
        Use when the user asks about billed purchases, spend per vendor, expense category,
        project or cost centre. For total expenses or profit use pnl.
    cubes:
      - join_path: purchase_lines
        includes:
          - organization_id
          - document_date
          - document_type
          - status
          - vendor_name
          - expense_category
          - project_name
          - cost_center_name
          - gross_purchases
          - vendor_credits
          - net_purchases
          - input_vat
          - bill_count
          - vendor_count
      - join_path: purchase_lines.organizations
        includes:
          - name: name
            alias: organization_name
          - currency
