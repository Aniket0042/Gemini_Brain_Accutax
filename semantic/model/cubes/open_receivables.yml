# Open sales invoices as of today: what customers owe.
#
# Payment state lives in the status: amount_paid stays 0 even on PAID invoices,
# so only PENDING and PARTIALLY_PAID invoices count as open. Status has no
# history, so this view answers for today only. The total comes from a LATERAL
# subquery, so item rows cannot multiply header amounts. Invoices dated after
# today are not yet receivable. "Today" is local_today: the date in the
# organization's own time zone (Asia/Dubai for nearly all; unknown values fall back
# to it). The UTC date was a day behind Dubai for four hours every night.
#
# No curly braces in SQL literals: Cube's YAML reads {...} as a member reference.
cubes:
  - name: open_receivables
    description: Open sales invoices as of today. Payment state comes from the status.
    public: false
    sql: >
      SELECT inc.id               AS document_id,
             inc.organization_id  AS organization_id,
             inc.invoice_number   AS document_number,
             st.value             AS status,
             CASE WHEN CAST(inc.invoice_date AS TEXT) ~ '^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
                  THEN CAST(LEFT(CAST(inc.invoice_date AS TEXT), 10) AS DATE) END AS document_date,
             CASE WHEN CAST(inc.due_date AS TEXT) ~ '^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
                  THEN CAST(LEFT(CAST(inc.due_date AS TEXT), 10) AS DATE) END     AS due_date,
             COALESCE(NULLIF(c.name, ''), NULLIF(c.organization_name, ''), 'Unknown') AS customer_name,
             t.total_incl_vat - COALESCE(inc.amount_paid, 0) AS outstanding,
             lt.local_today                                AS local_today
      FROM   public.income inc
      JOIN   public.status_type st ON st.id = inc.status_type_id
      JOIN   public.organizations o ON o.id = inc.organization_id
      CROSS  JOIN LATERAL (
               SELECT CAST(CURRENT_TIMESTAMP AT TIME ZONE CASE WHEN o.timezone IN ('Asia/Dubai', 'Asia/Kolkata', 'Asia/Riyadh', 'Asia/Muscat', 'Asia/Qatar', 'Asia/Bahrain', 'Asia/Kuwait', 'Europe/London', 'UTC') THEN o.timezone WHEN o.timezone LIKE 'UTC%' THEN 'UTC' ELSE 'Asia/Dubai' END AS DATE) AS local_today
             ) lt
      LEFT   JOIN public.contacts c ON c.id = inc.contact_id AND c.organization_id = inc.organization_id
      CROSS  JOIN LATERAL (
               SELECT COALESCE(SUM(ii.line_amount + COALESCE(ii.tax_amount, 0)), 0) AS total_incl_vat
               FROM   public.income_items ii
               WHERE  ii.income_id = inc.id
             ) t
      WHERE  inc.income_type IN ('INVOICE', 'CASH_INVOICE', 'INCOME')
        AND  inc.is_draft = false
        AND  inc.voided_at IS NULL
        AND  st.value IN ('PENDING', 'PARTIALLY_PAID')
        AND  NOT (CAST(inc.invoice_date AS TEXT) ~ '^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
                  AND CAST(LEFT(CAST(inc.invoice_date AS TEXT), 10) AS DATE) > lt.local_today)

    joins:
      - name: organizations
        relationship: many_to_one
        sql: "{CUBE.organization_id} = {organizations.id}"

    dimensions:
      - name: document_id
        sql: document_id
        type: number
        primary_key: true
      - name: organization_id
        sql: organization_id
        type: number
      - name: document_number
        sql: document_number
        type: string
      - name: status
        sql: status
        type: string
      - name: customer_name
        sql: customer_name
        type: string
      - name: document_date
        sql: document_date
        type: time
      - name: due_date
        sql: due_date
        type: time
      - name: days_overdue
        description: Days past the due date; 0 when not yet due.
        type: number
        sql: "CASE WHEN {CUBE}.due_date < {CUBE}.local_today THEN {CUBE}.local_today - {CUBE}.due_date ELSE 0 END"
      - name: aging_bucket
        description: No due date, Not yet due, 1-30 days, 31-60 days, 61-90 days or Over 90 days.
        type: string
        sql: >
          CASE WHEN {CUBE}.due_date IS NULL THEN 'No due date'
               WHEN {CUBE}.due_date >= {CUBE}.local_today THEN 'Not yet due'
               WHEN {CUBE}.local_today - {CUBE}.due_date <= 30 THEN '1-30 days'
               WHEN {CUBE}.local_today - {CUBE}.due_date <= 60 THEN '31-60 days'
               WHEN {CUBE}.local_today - {CUBE}.due_date <= 90 THEN '61-90 days'
               ELSE 'Over 90 days' END

    measures:
      - name: outstanding
        description: Unpaid amount including VAT on open invoices.
        type: sum
        sql: "{CUBE}.outstanding"
      - name: overdue_amount
        description: Unpaid amount including VAT on open invoices past their due date.
        type: sum
        sql: "{CUBE}.outstanding"
        filters:
          - sql: "{CUBE}.due_date < {CUBE}.local_today"
      - name: open_count
        description: Number of open invoices.
        type: count
      - name: overdue_count
        description: Number of open invoices past their due date.
        type: count
        filters:
          - sql: "{CUBE}.due_date < {CUBE}.local_today"
