# Posted general-ledger lines. Source of the P&L and the balance sheet.
#
# Rules match Accutax getProfitLossWithChartAccounts (report.service.ts): posted
# entries only; Revenue = credit - debit; Expense = debit - credit; cost of sales
# is an Expense account with sub-type "Cost of Sales". The account join also
# matches on organization, so a line posted to another tenant's account drops out.
#
# No curly braces in SQL literals: Cube's YAML reads {...} as a member reference.
cubes:
  - name: gl_lines
    description: Posted general-ledger lines, one row per journal entry line.
    public: false
    sql: >
      SELECT l.id               AS line_id,
             j.id               AS journal_id,
             j.organization_id  AS organization_id,
             j.transaction_date AS transaction_date,
             j.source_type      AS source_type,
             j.journal_number   AS journal_number,
             j.reference_number AS reference_number,
             j.description      AS journal_description,
             l.description      AS line_description,
             c.account_code     AS account_code,
             c.account_name     AS account_name,
             c.account_type     AS account_type,
             c.account_sub_type AS account_sub_type,
             c.currency         AS account_currency,
             l.debit_amount     AS debit_amount,
             l.credit_amount    AS credit_amount
      FROM   public.journal_entry_lines l
      JOIN   public.journal_entries     j ON j.id = l.journal_entry_id
      JOIN   public.chart_of_accounts   c ON c.id = l.account_id
                                         AND c.organization_id = j.organization_id
      WHERE  j.is_posted

    joins:
      - name: organizations
        relationship: many_to_one
        sql: "{CUBE.organization_id} = {organizations.id}"

    dimensions:
      - name: line_id
        sql: line_id
        type: number
        primary_key: true
      - name: organization_id
        sql: organization_id
        type: number
      - name: transaction_date
        sql: transaction_date
        type: time
      - name: source_type
        description: What created the entry (INCOME, EXPENSE, MANUAL, BANK_TRANSACTION, ADJUSTMENT, PAYMENT).
        sql: source_type
        type: string
      - name: journal_number
        sql: journal_number
        type: string
      - name: reference_number
        description: Reference of the source document, when it has one.
        sql: reference_number
        type: string
      - name: journal_description
        description: Narration of the journal entry.
        sql: journal_description
        type: string
      - name: line_description
        description: Narration of the line, when it has one.
        sql: line_description
        type: string
      - name: account_code
        sql: account_code
        type: string
      - name: account_name
        sql: account_name
        type: string
      - name: account_type
        description: Asset, Liability, Equity, Revenue or Expense.
        sql: account_type
        type: string
      - name: account_sub_type
        description: For example Operating Revenue, Cost of Sales, Operating Expense, Current Asset, Fixed Asset.
        sql: account_sub_type
        type: string
      - name: account_currency
        sql: account_currency
        type: string

    measures:
      # ── Ledger detail (flow): query with a period ───────────────────────
      - name: debit
        description: Sum of debit amounts.
        type: sum
        sql: "{CUBE}.debit_amount"
      - name: credit
        description: Sum of credit amounts.
        type: sum
        sql: "{CUBE}.credit_amount"
      - name: net_movement
        description: Debit minus credit. Positive raises an asset or expense; negative raises a liability, equity or revenue.
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
      - name: line_count
        description: Number of journal lines.
        type: count
      - name: journal_count
        description: Number of journal entries.
        type: count_distinct
        sql: "{CUBE}.journal_id"

      # ── P&L (flow): query with a period ─────────────────────────────────
      - name: revenue
        description: Revenue excluding VAT, from posted entries on all Revenue accounts.
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Revenue'"
      - name: other_income
        description: Revenue on accounts with sub-type Non-Operating Revenue. Already part of revenue.
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Revenue' AND {CUBE}.account_sub_type = 'Non-Operating Revenue'"
      - name: cost_of_sales
        description: Expense accounts with sub-type Cost of Sales.
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Expense' AND LOWER(COALESCE({CUBE}.account_sub_type, '')) = 'cost of sales'"
      - name: operating_expenses
        description: All Expense accounts other than cost of sales.
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Expense' AND LOWER(COALESCE({CUBE}.account_sub_type, '')) <> 'cost of sales'"
      - name: total_expenses
        description: Cost of sales plus operating expenses.
        type: number
        sql: "COALESCE({cost_of_sales}, 0) + COALESCE({operating_expenses}, 0)"
      - name: gross_profit
        description: Revenue minus cost of sales.
        type: number
        sql: "COALESCE({revenue}, 0) - COALESCE({cost_of_sales}, 0)"
      - name: net_profit
        description: Revenue minus cost of sales and operating expenses.
        type: number
        sql: "COALESCE({revenue}, 0) - COALESCE({cost_of_sales}, 0) - COALESCE({operating_expenses}, 0)"
      - name: gross_margin_pct
        description: Gross profit as a percentage of revenue. Empty when revenue is zero or negative.
        type: number
        sql: "CASE WHEN COALESCE({revenue}, 0) > 0 THEN 100.0 * ({gross_profit}) / {revenue} END"
      - name: net_margin_pct
        description: Net profit as a percentage of revenue. Empty when revenue is zero or negative.
        type: number
        sql: "CASE WHEN COALESCE({revenue}, 0) > 0 THEN 100.0 * ({net_profit}) / {revenue} END"

      # ── Balances: query with a range from the beginning of time to the as-of date ──
      - name: assets
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Asset'"
      - name: current_assets
        description: Asset accounts with sub-type Current Asset.
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Asset' AND {CUBE}.account_sub_type = 'Current Asset'"
      - name: fixed_assets
        description: Asset accounts with sub-type Fixed Asset.
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Asset' AND {CUBE}.account_sub_type = 'Fixed Asset'"
      - name: liabilities
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Liability'"
      - name: current_liabilities
        description: Liability accounts with sub-type Current Liability.
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Liability' AND {CUBE}.account_sub_type = 'Current Liability'"
      - name: working_capital
        description: Current assets minus current liabilities.
        type: number
        sql: "COALESCE({current_assets}, 0) - COALESCE({current_liabilities}, 0)"
      - name: current_ratio
        description: Current assets divided by current liabilities. Empty when current liabilities are zero or negative.
        type: number
        sql: "CASE WHEN COALESCE({current_liabilities}, 0) > 0 THEN 1.0 * COALESCE({current_assets}, 0) / {current_liabilities} END"
      - name: equity_booked
        description: Equity accounts, before earnings not yet closed into equity.
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Equity'"
      - name: accumulated_earnings
        description: Revenue minus expenses not yet closed into equity.
        type: sum
        sql: "{CUBE}.credit_amount - {CUBE}.debit_amount"
        filters:
          - sql: "{CUBE}.account_type IN ('Revenue', 'Expense')"
      - name: total_equity
        description: Booked equity plus accumulated earnings.
        type: number
        sql: "COALESCE({equity_booked}, 0) + COALESCE({accumulated_earnings}, 0)"
      - name: balance_difference
        description: Assets minus liabilities minus equity. Non-zero means the ledger does not balance.
        type: number
        sql: "COALESCE({assets}, 0) - COALESCE({liabilities}, 0) - ({total_equity})"
      - name: cash_and_bank
        description: Asset accounts whose name contains cash or bank (same rule as the rpt_cash_balance report).
        type: sum
        sql: "{CUBE}.debit_amount - {CUBE}.credit_amount"
        filters:
          - sql: "{CUBE}.account_type = 'Asset' AND ({CUBE}.account_name ILIKE '%cash%' OR {CUBE}.account_name ILIKE '%bank%')"
