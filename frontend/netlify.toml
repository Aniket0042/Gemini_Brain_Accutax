# Netlify configuration for Gemini Brain Accutax Frontend
[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
