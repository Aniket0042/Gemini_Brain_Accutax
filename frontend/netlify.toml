# Netlify configuration for Gemini Brain Accutax Frontend
[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* calls to the EC2 backend (Replace with your actual EC2 public IP or domain)
# Example: to = "http://YOUR_EC2_PUBLIC_IP:8000/api/:splat"
[[redirects]]
  from = "/api/*"
  to = "http://YOUR_EC2_IP:8000/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
