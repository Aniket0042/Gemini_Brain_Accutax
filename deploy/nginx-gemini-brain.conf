# nginx site config: serves the built React UI as static files and reverse-proxies
# /api, /docs, /redoc, /openapi.json to uvicorn on 127.0.0.1:8010. Frontend and
# backend are served from the same origin on this one EC2 instance.
#
# This box already has an nginx site called `accutax` that owns the catch-all
# `server_name _;` on port 80 (proxying a different app to 127.0.0.1:8000).
# This site intentionally uses an EXPLICIT server_name (this instance's public
# DNS) instead of `_`, so nginx routes by Host header: requests to
# ec2-13-205-100-89.ap-south-1.compute.amazonaws.com come here, everything
# else keeps falling through to `accutax` exactly as it does today. The
# `accutax` site file is never touched by this.
#
# Install:
#   sudo cp nginx-gemini-brain.conf /etc/nginx/sites-available/gemini-brain
#   sudo ln -s /etc/nginx/sites-available/gemini-brain /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a real TLS cert for the same DNS name (free, no domain purchase
# needed -- it's a real, publicly resolvable A record pointing at this
# instance):
#   sudo certbot --nginx -d ec2-13-205-100-89.ap-south-1.compute.amazonaws.com

server {
    listen 80;
    listen [::]:80;
    server_name ec2-13-205-100-89.ap-south-1.compute.amazonaws.com;

    root /opt/gemini-brain/ui/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/query/stream is Server-Sent Events -- must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://127.0.0.1:8010/docs; }
    location /redoc { proxy_pass http://127.0.0.1:8010/redoc; }
    location /openapi.json { proxy_pass http://127.0.0.1:8010/openapi.json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
