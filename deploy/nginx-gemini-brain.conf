# nginx site config: serves the built React UI as static files and reverse-proxies
# /api, /docs, /redoc, /openapi.json to uvicorn on 127.0.0.1:8000. Frontend and
# backend are served from the same origin on this one EC2 instance.
#
# Install:
#   sudo cp nginx-gemini-brain.conf /etc/nginx/sites-available/gemini-brain
#   sudo ln -s /etc/nginx/sites-available/gemini-brain /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a real TLS cert for this box's EC2 public DNS name (no custom domain
# needed -- Let's Encrypt will issue for ec2-*.compute.amazonaws.com since it's
# a real, publicly resolvable A record pointing at this instance), or for your
# own domain if you point one at this instance's IP:
#   sudo certbot --nginx -d ec2-XX-XX-XX-XX.<region>.compute.amazonaws.com

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/gemini-brain/ui/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/query/stream is Server-Sent Events -- must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://127.0.0.1:8000/docs; }
    location /redoc { proxy_pass http://127.0.0.1:8000/redoc; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
