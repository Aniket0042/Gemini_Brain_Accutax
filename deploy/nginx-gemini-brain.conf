# nginx site config: serves the built React UI as static files and reverse-proxies
# /api, /docs, /redoc, /openapi.json to uvicorn on 127.0.0.1:8010. Frontend and
# backend are served from the same origin on this one EC2 instance.
#
# This box already has an nginx site called `accutax` that owns the catch-all
# `server_name _;` on port 80 (proxying a different app to 127.0.0.1:8000).
# This site intentionally uses an EXPLICIT server_name instead of `_`, so
# nginx routes by Host header: requests to that hostname come here, everything
# else keeps falling through to `accutax` exactly as it does today. The
# `accutax` site file is never touched by this.
#
# server_name is 13-205-100-89.sslip.io, NOT this instance's own
# ec2-*.compute.amazonaws.com DNS name -- Let's Encrypt refuses to issue
# certificates for *.amazonaws.com as a matter of policy. sslip.io is a free
# wildcard DNS service: <ip-with-dashes>.sslip.io always resolves to that IP
# with zero configuration, and it's an eligible domain for a real cert.
#
# Install:
#   sudo cp nginx-gemini-brain.conf /etc/nginx/sites-available/gemini-brain
#   sudo ln -s /etc/nginx/sites-available/gemini-brain /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a real TLS cert for the same hostname:
#   sudo certbot --nginx -d 13-205-100-89.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name 13-205-100-89.sslip.io;

    root /opt/gemini-brain/ui/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/query/stream is Server-Sent Events -- must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://127.0.0.1:8010/docs; }
    location /redoc { proxy_pass http://127.0.0.1:8010/redoc; }
    location /openapi.json { proxy_pass http://127.0.0.1:8010/openapi.json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
