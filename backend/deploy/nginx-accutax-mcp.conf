# nginx site for the MCP connector: HTTPS on the MCP domain, everything proxied to 127.0.0.1:8012
# (accutax-mcp.service). Replace mcp.your-domain.com everywhere below with the real domain.
#
# ChatGPT and Claude reach this from the internet, so the domain must resolve to this box and ports 443
# (and 80, for the certificate) must reach nginx. On the 106.51.80.81 VM the router forwards only
# 3434/3535/5558 today: add 80->80 and 443->443, or use a Cloudflare Tunnel instead of this file.
#
# Install (CentOS: conf.d):
#   sudo cp nginx-accutax-mcp.conf /etc/nginx/conf.d/accutax-mcp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.your-domain.com

# Sign-in, token and registration endpoints are the ones worth guessing at; slow them down per IP.
limit_req_zone $binary_remote_addr zone=mcp_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.your-domain.com;
    # certbot answers its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Old-style http2 flag: CentOS Stream 9's nginx predates the `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.your-domain.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/mcp.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location ~ ^/(login|token|register|revoke)$ {
        limit_req zone=mcp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Streamable HTTP answers can be Server-Sent Events, and ask_accutax can run minutes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
