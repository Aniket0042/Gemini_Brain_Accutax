[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-brain"
version = "0.1.0"
description = "Accutax AI backend: a tool-using agent on AWS Bedrock over Cube figures, UAE VAT law and the app guide."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# UAE VAT knowledge base (docs/product/VAT_KNOWLEDGE_BASE_PLAN.md). Permissive licences only:
# pypdf BSD-3, rank_bm25 Apache-2.0, fastembed Apache-2.0 (onnxruntime MIT), beautifulsoup4 MIT.
# Install with: pip install -e "backend[vat_kb]"
vat_kb = [
    "pypdf>=6.0",
    "rank_bm25>=0.2.2",
    "fastembed>=0.8.0",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gemini_brain.agents" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
