# Accutax AI: API + web UI as two containers.
#
# This is the standard setup for a fresh server where the database, Cube and the
# Accutax backend are reached by a real host name or IP. A server that reaches them on
# 127.0.0.1 (the VM and EC2 today) uses docker-compose.host.yml instead.
#
#   docker compose --env-file docker/deploy.env up -d --build
#
# docker/deploy.env holds the settings for this file (ports, image tag, where the app's
# env file and VAT knowledge base live, frontend build values). Copy it from
# docker/deploy.env.example. The app's own secrets stay in the env file it points to.

name: accutax-ai

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: accutax-ai-api:${AI_IMAGE_TAG:-latest}
    env_file:
      - ${AI_ENV_FILE:-.env}
    environment:
      VAT_KB_DIR: /kb
    volumes:
      - ai-data:/data
      - ${AI_KB_DIR:-./vat_kb_data}:/kb
    extra_hosts:
      # Lets the app reach services running on the server itself as host.docker.internal
      # (they must listen on more than 127.0.0.1 for that to work).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-legacy}
        VITE_BFF_API_URL: ${VITE_BFF_API_URL:-}
        VITE_HUB_URL: ${VITE_HUB_URL:-}
        VITE_ACCUTAX_APP_URL: ${VITE_ACCUTAX_APP_URL:-}
        VITE_SHOW_SQL_TRACES: ${VITE_SHOW_SQL_TRACES:-}
        VITE_SHOW_API_TRACES: ${VITE_SHOW_API_TRACES:-}
        VITE_SHOW_LLM_TRACES: ${VITE_SHOW_LLM_TRACES:-}
        VITE_SHOW_PRIVACY_BADGE: ${VITE_SHOW_PRIVACY_BADGE:-}
        ALLOW_INSECURE_BFF: ${ALLOW_INSECURE_BFF:-}
    image: accutax-ai-web:${AI_IMAGE_TAG:-latest}
    ports:
      - "${AI_WEB_BIND:-0.0.0.0}:${AI_WEB_PORT:-8020}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai-data:
